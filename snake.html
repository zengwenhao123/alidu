<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇游戏</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --text: #e5e7eb;
      --accent: #34d399;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(circle at top, #1f2937, var(--bg));
      color: var(--text);
    }
    .game {
      width: min(92vw, 520px);
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid #374151;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      padding: 18px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stats {
      display: flex;
      gap: 12px;
      font-weight: 600;
      font-size: 15px;
    }
    button {
      border: 0;
      background: var(--accent);
      color: #052e24;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform .06s ease;
    }
    button:active { transform: translateY(1px); }
    canvas {
      width: 100%;
      background: #0b1220;
      border-radius: 10px;
      border: 1px solid #374151;
      display: block;
      aspect-ratio: 1 / 1;
    }
    .hint {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 10px;
      line-height: 1.5;
    }
    .danger { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <main class="game">
    <div class="top">
      <div class="stats">
        <span>得分: <strong id="score">0</strong></span>
        <span>最高分: <strong id="best">0</strong></span>
      </div>
      <button id="restartBtn" type="button">重新开始</button>
    </div>
    <canvas id="board" width="400" height="400" aria-label="贪吃蛇画布"></canvas>
    <p class="hint">
      操作：方向键 / WASD。<span class="danger">撞墙或撞到自己会结束游戏。</span>
    </p>
  </main>

  <script>
    const GRID_SIZE = 20;
    const CELL = 20;
    const SPEED = 130;

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restartBtn');

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let best = Number(localStorage.getItem('snake-best') || 0);
    let timer;
    let gameOver;

    bestEl.textContent = best;

    function randomCell() {
      return {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
    }

    function spawnFood() {
      let pos = randomCell();
      while (snake.some(part => part.x === pos.x && part.y === pos.y)) {
        pos = randomCell();
      }
      food = pos;
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      score = 0;
      scoreEl.textContent = score;
      gameOver = false;
      spawnFood();
      clearInterval(timer);
      timer = setInterval(loop, SPEED);
      draw();
    }

    function setDirection(x, y) {
      if (direction.x === -x && direction.y === -y) return;
      nextDirection = { x, y };
    }

    function handleInput(e) {
      const key = e.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') setDirection(0, -1);
      else if (key === 'arrowdown' || key === 's') setDirection(0, 1);
      else if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
      else if (key === 'arrowright' || key === 'd') setDirection(1, 0);
      else if (key === ' ') {
        if (gameOver) resetGame();
      }
    }

    function loop() {
      if (gameOver) return;

      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID_SIZE || head.y >= GRID_SIZE;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);

      if (hitWall || hitSelf) {
        gameOver = true;
        clearInterval(timer);
        draw();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('snake-best', String(best));
          bestEl.textContent = best;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function drawCell(x, y, color, radius = 4) {
      ctx.fillStyle = color;
      const px = x * CELL;
      const py = y * CELL;
      const size = CELL - 1;
      ctx.beginPath();
      ctx.roundRect(px, py, size, size, radius);
      ctx.fill();
    }

    function drawGrid() {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        const p = i * CELL;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function draw() {
      drawGrid();
      drawCell(food.x, food.y, '#ef4444', 8);

      snake.forEach((part, i) => {
        const color = i === 0 ? '#34d399' : '#10b981';
        drawCell(part.x, part.y, color, i === 0 ? 7 : 4);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f9fafb';
        ctx.textAlign = 'center';
        ctx.font = 'bold 34px Microsoft YaHei';
        ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = '16px Microsoft YaHei';
        ctx.fillStyle = '#d1d5db';
        ctx.fillText('按空格或点击“重新开始”继续', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    restartBtn.addEventListener('click', resetGame);
    window.addEventListener('keydown', handleInput);

    resetGame();
  </script>
</body>
</html>
